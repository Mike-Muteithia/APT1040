<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Table Practice</title>
</head>
<body>
  <table border="1" style="border-collapse: collapse;">
    <tr>
      <th colspan="2" style="padding: 10px;">Student Registeration</th>
    </tr>

    <tr>
      <th style="padding: 10px;">Student</th>
      <th style="padding: 10px;">Unit</th>
    </tr>

    <tr>
      <th rowspan="2" style="padding: 10px;">James</th>
      <td style="padding: 10px;">APT 1040</td>
    </tr>
    <tr>
      <td style="padding: 10px;">IST 1030</td>
    </tr>

    <tr>
      <th rowspan="4" style="padding: 10px;">Ann</th>
      <td style="padding: 10px;">APT 1040</td>
    </tr>
    <tr>
      <td style="padding: 10px;">IST 1030</td>
    </tr>
    <tr>
      <td style="padding: 10px;">APT1050</td>
    </tr>
    <tr>
      <td style="padding: 10px;">APT 1120</td>
    </tr>

  </table>
</body>
</html>
