<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Form1</title>
</head>
<body>
  <form action="" method="post">
    <label for="fname">First Name</label> <br>
    <input type="text" name="fname" id="fname"> <br>
    <br>
    <label for="lname">Last Name</label> <br>
    <input type="text" name="lname" id="lname"> <br>
    <br>
    <label for="pword">Password</label> <br>
    <input type="pword" name="pword" id="pword"> <br>
    <br>
    <label for="email">Email</label> <br>
    <input type="email" name="email" id="email"> <br>

    <hr>

    <h3>Gender</h3>
    <label for="male">Male</label>
    <input type="radio" name="gender" id="male">
    <label for="female">Female</label>
    <input type="radio" name="gender" id="female">
    <label for="others">Others</label>
    <input type="radio" name="gender" id="others">

    <hr>

    <h3>Courses</h3>
    <input type="checkbox" name="apt1040" id="web-design">
    <label for="web-design">Web Design</label> 
    <br><br>
    <input type="checkbox" name="ist1025" id="intro-to-prog">
    <label for="intro-to-prog">Intro to Programming</label> 
    <br><br>
    <input type="checkbox" name="apt1040" id="intro-to-prog-lan">
    <label for="intro-to-prog">Intro to Programming Languages</label>
    <br><br>
    <input type="checkbox" name="grm2000" id="intro-to-research-meth">
    <label for="intro-to-research-meth">Intro to Research Methods</label>
    <br><br>
    <input type="checkbox" name="mth1109" id="college-alg">
    <label for="college-alg">College Algebra</label>

    <hr>

    <h3>Nationality</h3>
    <label for="nation">Choose your nationality:</label>
    <br>
    <select name="nation" id="nation">
      <option value="kenya" selected>Kenya</option>
      <option value="uganda">Uganda</option>
      <option value="rwanda">Rwanda</option>
      <option value="tanzania">Tanzania</option>
      <option value="burundi">Burundi</option>
      <option value="congo">Repubic of Congo</option>
      <option value="ghana">Ghana</option>
      <option value="nigeria">Nigeria</option>
      <option value="egypt">Egypt</option>
      <option value="south-africa">South Africa</option>
      <option value="morocco">Morocco</option>
      <option value="zambia">Zambia</option>
      <option value="niger">Niger</option>
      <option value="algeria">Algeria</option>
    </select>


    <hr>
    <!-- datalist -->
    <h3>Broswers</h3>

    <input type="text" id="" list="browser">
    <datalist id="browser">
      <option value="safari">
      <option value="Chrome">
      <option value="Opera">
      <option value="Brave">
    </datalist>

    <hr>
    <!-- textarea -->
    <h3>Comments</h3>
    <textarea name="" id="" cols="30" rows="6"></textarea>

    <hr>
    <!-- submit & reset button -->
    
    <input type="submit" value="Submit">
    <input type="reset" value="Reset">


    <br><br><br><br><br>


  </form>
</body>
</html>
