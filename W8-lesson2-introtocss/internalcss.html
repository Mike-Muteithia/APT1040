<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CSS Syntax</title>

  <!-- Internal CSS -->
  <!-- <style> selector { property: value} </style> -->
  <style>
    h2 {
      color: blue;
      font-size: 18px;
      text-align: center;
    }

    p {
      background-color: black;
      color: white;
    }

    h3 {
      color: blue;
      text-transform: uppercase;
      text-decoration: underline;
      text-align: right;
    }
  </style>
</head>
<body>
  <!-- Inline CSS -->
  <!-- style="property: value" -->
  <h1 style="color: red; font-size: 20px;">Introduction to CSS</h1>
  <!-- Limitations: repetition on each element -->

  <p>Used for appearance and layout</p>
  <h1 style="color: green">Syntax</h1>
      <h2>Selector</h2>
      <h2>Declaration</h2>
          <h3>property</h3>
          <h3>value</h3>
</body>
</html>
